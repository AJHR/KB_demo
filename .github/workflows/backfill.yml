# Backfill historico de todas las fuentes — se lanza manualmente
# (workflow_dispatch). Corre en runners de GitHub porque el sandbox de las
# sesiones de Claude Code no tiene salida a internet (wiki/decisiones.md D-002).
#
# Estrategia: un job por fuente en paralelo; cada job sube su data/raw parcial
# como artifact; el job final consolida, construye la tabla maestra, corre los
# validadores y commitea todo de una vez (evita carreras de push).
#
# Secrets opcionales:
#   COORDINADOR_USER_KEY — API SIP del Coordinador (las fuentes cen_* se
#                          omiten con aviso si falta; registro gratuito en
#                          portal.api.coordinador.cl)
#   EIA_API_KEY          — series spot oficiales EIA (opcional)

name: backfill-historico

on:
  workflow_dispatch:
    inputs:
      inicio:
        description: "Fecha inicio (YYYY-MM-DD)"
        default: "2019-01-01"
      fin:
        description: "Fecha fin (YYYY-MM-DD; vacio = hoy)"
        default: ""
      fuentes:
        description: "Fuentes (coma) | 'todas' | 'cmg_real_mensual' (shard mensual de cmg_real)"
        default: "todas"

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  extraer:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        fuente:
          - calendario
          - clima_observado
          - clima_pronostico
          - combustibles
          - cen_cmg_real
          - cen_cmg_programado
          - cen_demanda
          - cen_generacion
          - cen_embalses
          - cen_po
          - cen_web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install --quiet pandas pyarrow requests holidays yfinance
      - name: Filtrar fuente segun input
        id: filtro
        run: |
          FUENTES="${{ github.event.inputs.fuentes }}"
          if [ "$FUENTES" = "todas" ] || echo ",$FUENTES," | grep -q ",${{ matrix.fuente }},"; then
            echo "correr=si" >> "$GITHUB_OUTPUT"
          else
            echo "correr=no" >> "$GITHUB_OUTPUT"
          fi
      - name: Backfill ${{ matrix.fuente }}
        if: steps.filtro.outputs.correr == 'si'
        working-directory: tools/etl
        env:
          COORDINADOR_USER_KEY: ${{ secrets.COORDINADOR_USER_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          FIN="${{ github.event.inputs.fin }}"
          [ -z "$FIN" ] && FIN=$(date -u +%F)
          python3 run_etl.py --modo backfill \
            --fuentes "${{ matrix.fuente }}" \
            --inicio "${{ github.event.inputs.inicio }}" --fin "$FIN"
      - name: Subir datos como artifact
        if: steps.filtro.outputs.correr == 'si'
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ matrix.fuente }}
          path: data/raw/
          if-no-files-found: warn
          retention-days: 7

  # cen_cmg_real es enorme (todas las barras en 15-min: ~2-4 millones de
  # filas/mes; un mes completo no cabe junto a los demas en 6h). Se shardea por
  # mes: un job por mes corre en paralelo y cada uno cabe holgado. El extractor
  # ademas baja dia por dia (paginacion somera) para evitar los 502 del gateway.
  cmg_real_mensual:
    if: ${{ github.event.inputs.fuentes == 'cmg_real_mensual' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      # max-parallel=1 OBLIGATORIO: el gateway SIP limita requests por user_key
      # (~530 req/h medido). Varios jobs en paralelo comparten ese techo y se
      # gatillan 429 sostenidos (run #27549680772 a 3, #27561362926 a 2: casi
      # todos los meses fallaban). La concurrencia NO ayuda cuando el cuello de
      # botella es el limite por key; un solo job a la vez completa cada mes.
      max-parallel: 1
      matrix:
        include:
          # Extension de historia (sesion 2026-06-17): el bloque commiteado
          # va 2025-03..2026-06 (~461 dias, 4 folds). Se baja TODO el resto
          # del regimen "nuevo" hacia atras hasta su inicio (2024-07-15;
          # antes de esa fecha el endpoint devuelve 0 filas — ver
          # extractor_cen_cmg_real.FECHA_INICIO_DATOS). Son 8 meses
          # (2024-07..2025-02) => bloque contiguo 2024-07-15..2026-06-07
          # (~693 dias) => ~11 folds con min_train=365, sin tocar el
          # protocolo. Las demas fuentes (calendario, clima, combustibles)
          # ya cubren ese rango en disco; solo falta el objetivo (CMg real).
          # Orden DESCENDENTE: cada mes que completa extiende el bloque
          # contiguo un paso mas atras. Con max-parallel=1 son ~20-32h.
          # La tolerancia a dias irrecuperables (skip-day) ya esta en el
          # extractor, asi que 2025-01/02 (que antes tumbaban el mes) ya no
          # abortan. 2024-07 trae solo ~17 dias (regimen arranca el 15).
          - { ini: "2025-02-01", fin: "2025-02-28" }
          - { ini: "2025-01-01", fin: "2025-01-31" }
          - { ini: "2024-12-01", fin: "2024-12-31" }
          - { ini: "2024-11-01", fin: "2024-11-30" }
          - { ini: "2024-10-01", fin: "2024-10-31" }
          - { ini: "2024-09-01", fin: "2024-09-30" }
          - { ini: "2024-08-01", fin: "2024-08-31" }
          - { ini: "2024-07-01", fin: "2024-07-31" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install --quiet pandas pyarrow requests holidays
      - name: Backfill cen_cmg_real ${{ matrix.ini }}
        working-directory: tools/etl
        env:
          COORDINADOR_USER_KEY: ${{ secrets.COORDINADOR_USER_KEY }}
        run: |
          python3 run_etl.py --modo backfill \
            --fuentes cen_cmg_real \
            --inicio "${{ matrix.ini }}" --fin "${{ matrix.fin }}"
      - name: Subir datos como artifact
        uses: actions/upload-artifact@v4
        with:
          name: raw-cmg_real-${{ matrix.ini }}
          path: data/raw/
          if-no-files-found: warn
          retention-days: 7

  consolidar:
    needs: [extraer, cmg_real_mensual]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install --quiet pandas pyarrow duckdb requests holidays
      - name: Descargar artifacts de todas las fuentes
        uses: actions/download-artifact@v4
        with:
          pattern: raw-*
          path: /tmp/artifacts
          merge-multiple: true
      - name: Fusionar en data/raw
        run: |
          mkdir -p data/raw
          cp -r /tmp/artifacts/* data/raw/ 2>/dev/null || true
          find data/raw -name "*.parquet" | head -50
          echo "total parquet: $(find data/raw -name '*.parquet' | wc -l)"
      - name: Construir tabla maestra (si hay datos CEN reales)
        working-directory: tools/etl
        run: |
          if ls ../../data/raw/cen_cmg_real/*/*.parquet >/dev/null 2>&1; then
            python3 construir_tabla_maestra.py --origen real
          else
            echo "::warning::sin datos CMg real (falta COORDINADOR_USER_KEY?); tabla maestra no reconstruida"
          fi
      - name: Validadores de calidad
        working-directory: tools/etl
        run: python3 validadores.py --reporte || echo "::warning::validadores reportaron problemas"
      - name: Commit de datos
        run: |
          git config user.name "etl-backfill[bot]"
          git config user.email "etl@users.noreply.github.com"
          git add data/raw data/processed wiki/calidad_datos.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "sin cambios que commitear"
          else
            git commit -m "backfill: datos historicos ${{ github.event.inputs.inicio }}..${{ github.event.inputs.fin || 'hoy' }} (run ${{ github.run_id }})"
            # data/processed (tabla_maestra.parquet, metadatos) es REGENERADO:
            # si otro commit del remoto ya lo tocó, el rebase normal entra en
            # conflicto y el push se pierde (run #27563427333: se rebuildeó la
            # tabla pero el rebase chocó y NO se commiteó ni un mes). Con
            # `-X theirs` el commit recién reconstruido gana el conflicto (es el
            # autoritativo). Reintentos por si otro push entra en la carrera.
            for intento in 1 2 3 4 5; do
              git fetch origin "${GITHUB_REF_NAME}"
              git rebase -X theirs "origin/${GITHUB_REF_NAME}" || { git rebase --abort || true; }
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                echo "push ok (intento $intento)"; break
              fi
              echo "push falló (intento $intento); reintento"; sleep 5
            done
          fi
